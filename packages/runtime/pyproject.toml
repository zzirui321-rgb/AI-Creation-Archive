[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aica-runtime"
version = "0.1.0"
description = "Evidence-based semantic analysis of AiCA archives"
requires-python = ">=3.12,<3.13"
dependencies = ["aica-schema==0.1.0", "pydantic>=2.14,<3", "httpx>=0.28,<0.29"]

[tool.setuptools.packages.find]
where = ["src"]
